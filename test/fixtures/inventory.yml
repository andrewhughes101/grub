all:
  hosts:
    myzos:
      ansible_host: zos.example.com
      ansible_user: zosuser
      ansible_ssh_private_key_file: ~/.ssh/id_zos
      ansible_port: 2022
      ansible_ssh_common_args: -o ProxyJump=jump.example.com
      grub_server_root: /u/zosuser/projects
      grub_git_dir: /usr/lpp/IBM/foz/v1r1/bin
    mylinux:
      ansible_host: linux.example.com
      ansible_user: linuxuser
      grub_server_root: ~/dev
